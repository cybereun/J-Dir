[package]
name = "j-dir"
version = "1.2.3"
description = "J-Dir — The Quad Explorer for Windows"
authors = ["J-Dir"]
edition = "2021"

[lib]
name = "jdir_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
notify = "6"
encoding_rs = "0.8.42"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
getrandom = "0.3"
drag = { path = "vendor/drag" }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false
